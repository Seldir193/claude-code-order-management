services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
    # Not published to the host, so it cannot clash with a local PostgreSQL on 5432.
    volumes:
      - orders-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/orders
      DB_USER: orders
      DB_PASSWORD: orders
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  orders-db:
